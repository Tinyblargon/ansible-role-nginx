---
- name: Test nginx_get_info
  ansible.builtin.assert:
    that: nginx_get_info == test_item.output
    fail_msg: >-
      {{ 'Test: ' + test_item.name + ', Expected: ' + test_item.output | string
      + ' , but got: ' + nginx_get_info | string }}
  loop:
    - name: normal case
      output:
        - "/etc/letsencrypt/live/example/fullchain.pem"
        - "/etc/letsencrypt/live/example/privkey.pem"
      input: |-
        server {
        ssl_certificate             /etc/letsencrypt/live/example/fullchain.pem;
          ssl_certificate_key         /etc/letsencrypt/live/example/privkey.pem;
        }
    - name: commented out ssl_certificate
      output: ["/etc/letsencrypt/live/example/privkey.pem"]
      input: |-
        server {
        #  ssl_certificate             /etc/letsencrypt/live/example/fullchain.pem;
          ssl_certificate_key         /etc/letsencrypt/live/example/privkey.pem;
        }
    - name: commented out ssl_certificate_key
      output: ["/etc/letsencrypt/live/example/fullchain.pem"]
      input: |-
        server {
        ssl_certificate             /etc/letsencrypt/live/example/fullchain.pem;
        #  ssl_certificate_key         /etc/letsencrypt/live/example/privkey.pem;
        }
    - name: empty
      output: []
      input: ""
  loop_control:
    loop_var: test_item
  vars:
    item:
      content: "{{ test_item.input }}"
  ignore_errors: "{{ nginx_ci_ignore }}"
